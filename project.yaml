# project.yaml for midgard (Home Network)
# Import at /admin/import on lukeudell.com; the diff is shown before anything applies.
# Brief: luke-udell-portfolio/docs/contracts/project-config-handoff.md
#
# DRAFT, written at extraction from docs/CASE_STUDY.md.
# SANITISATION: no IPs, subnets, hostnames, VLAN numbers or vendor model numbers.
